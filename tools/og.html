<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Image de partage</title>
<style>

body { width: 1200px; height: 630px; background: #111; color: #fff; font-family: "Oswald", sans-serif; overflow: hidden; position: relative; }

.url { position: absolute; right: 70px; top: 82px; font: 700 22px "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #99a1af; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #ffd700; }
</style></head>
<body>
  <div class="url">portfolio.gwenaellebesson.fr</div>
